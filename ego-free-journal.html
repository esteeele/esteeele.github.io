<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdf6e3">
  <title>Ego Free Journal</title>
  <style>
    :root {
      color-scheme: light;
      --base: #fdf6e3;
      --ink: #343434;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: var(--base);
      color: var(--ink);
      font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
      padding: 0;
    }
    .editor {
      min-height: 100vh;
      position: relative;
      overflow: auto;
      padding: clamp(28px, 8vw, 100px);
      cursor: text;
    }
    #textCanvas, #hiddenArea {
      white-space: break-spaces;
      overflow-wrap: anywhere;
      font-family: inherit;
      font-size: clamp(19px, 2.3vw, 25px);
      line-height: 1.8;
      letter-spacing: .005em;
      outline: none;
    }
    #textCanvas { min-height: 1.8em; pointer-events: none; }
    .token-item { transition: opacity .3s ease, filter .3s ease; }
    .token-fading { filter: blur(1px); }
    #hiddenArea {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: clamp(28px, 8vw, 100px);
      resize: none;
      overflow: hidden;
      border: 0;
      outline: 0;
      color: transparent;
      background: transparent;
      caret-color: var(--ink);
    }
    #hiddenArea::selection { background: #b5890040; color: transparent; }
  </style>
</head>
<body>
  <main class="editor" aria-label="Writing area">
      <div id="textCanvas" aria-hidden="true"></div>
      <textarea id="hiddenArea" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="Write a note"></textarea>
  </main>
  <script>
    const state = { tokens: [], lifespan: 28, fadeWindow: 5, deleteInterval: 150 };
    const hiddenArea = document.getElementById('hiddenArea');
    const textCanvas = document.getElementById('textCanvas');
    const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
    let composing = false;
    let elements = [];

    // Slice by textarea offsets without changing the surviving text's age.
    function sliceTokens(start, end) {
      let offset = 0;
      return state.tokens.flatMap(token => {
        const text = token.text.slice(Math.max(0, start - offset), Math.max(0, end - offset));
        offset += token.text.length;
        return text ? [{ ...token, text }] : [];
      });
    }

    function handleInput() {
      const text = hiddenArea.value;
      const old = state.tokens.map(token => token.text).join('');
      const now = Date.now();
      let prefix = 0;
      while (prefix < old.length && prefix < text.length && old[prefix] === text[prefix]) prefix++;
      // Do not split a surrogate pair at the edit boundary.
      if (prefix > 0 && /[\uD800-\uDBFF]/.test(old[prefix - 1])) prefix--;
      let oldEnd = old.length - 1;
      let newEnd = text.length - 1;
      while (oldEnd >= prefix && newEnd >= prefix && old[oldEnd] === text[newEnd]) { oldEnd--; newEnd--; }
      if (/[\uDC00-\uDFFF]/.test(old[oldEnd + 1] || '')) { oldEnd++; newEnd++; }
      const before = sliceTokens(0, prefix);
      const after = sliceTokens(oldEnd + 1, old.length);
      const chunks = text.slice(prefix, newEnd + 1).match(/\S+|\s+/g) || [];
      const inserted = chunks.map((chunk, index) => {
        const previous = before[before.length - 1];
        // Continuing a word keeps its original expiration time.
        return index === 0 && previous && /\S$/.test(previous.text) && /^\S/.test(chunk)
          ? { ...previous, text: chunk }
          : { text: chunk, timestamp: now };
      });
      state.tokens = [];
      for (const token of [...before, ...inserted, ...after]) {
        const previous = state.tokens[state.tokens.length - 1];
        if (previous && previous.timestamp === token.timestamp && previous._lastDelete === token._lastDelete
            && /^\s/.test(previous.text) === /^\s/.test(token.text)) {
          previous.text += token.text;
        } else {
          state.tokens.push(token);
        }
      }
      renderCanvas();
    }

    function renderCanvas() {
      const fragment = document.createDocumentFragment();
      elements = [];
      for (const token of state.tokens) {
        const span = document.createElement('span');
        span.className = 'token-item';
        span.textContent = token.text;
        fragment.appendChild(span);
        elements.push(span);
      }
      // Reserve the last line even when the text ends with a newline.
      fragment.appendChild(document.createTextNode('\u200b'));
      textCanvas.replaceChildren(fragment);
      updateAppearance(Date.now());
    }

    function syncHiddenArea(oldLens) {
      const start = hiddenArea.selectionStart;
      const end = hiddenArea.selectionEnd;
      const direction = hiddenArea.selectionDirection;
      let newText = '';
      let oldOffset = 0;
      let newOffset = 0;
      let newStart = start;
      let newEnd = end;
      let startMapped = false;
      let endMapped = false;
      for (let i = 0; i < state.tokens.length; i++) {
        const token = state.tokens[i];
        const oldLen = oldLens[i];
        const newLen = token.text.length;
        newText += token.text;
        if (!startMapped && start <= oldOffset + oldLen) {
          newStart = newOffset + Math.min(start - oldOffset, newLen);
          startMapped = true;
        }
        if (!endMapped && end <= oldOffset + oldLen) {
          newEnd = newOffset + Math.min(end - oldOffset, newLen);
          endMapped = true;
        }
        oldOffset += oldLen;
        newOffset += newLen;
      }
      if (!startMapped) newStart = newOffset;
      if (!endMapped) newEnd = newOffset;
      hiddenArea.value = newText;
      hiddenArea.setSelectionRange(newStart, newEnd, direction);
    }

    function updateAppearance(now) {
      const fadeStart = state.lifespan * 1000;
      const deleteStart = (state.lifespan + state.fadeWindow) * 1000;
      state.tokens.forEach((token, index) => {
        const age = now - token.timestamp;
        const el = elements[index];
        if (el) {
          if (age >= fadeStart) {
            el.classList.add('token-fading');
            el.style.opacity = age < deleteStart
              ? Math.max(.05, (deleteStart - age) / (state.fadeWindow * 1000)).toFixed(2)
              : '.05';
          } else {
            el.classList.remove('token-fading');
            el.style.opacity = '1';
          }
        }
      });
    }

    function updateTokenLifespans() {
      const now = Date.now();
      const oldLens = state.tokens.map(token => token.text.length);
      const deleteStart = (state.lifespan + state.fadeWindow) * 1000;
      let changed = false;
      if (!composing) {
        for (const token of state.tokens) {
          if (now - token.timestamp >= deleteStart
              && (token._lastDelete === undefined || now - token._lastDelete >= state.deleteInterval)) {
            const graphemes = Array.from(segmenter.segment(token.text));
            token.text = token.text.slice(0, graphemes[graphemes.length - 1].index);
            token._lastDelete = now;
            changed = true;
          }
        }
      }

      if (changed) {
        syncHiddenArea(oldLens);
        state.tokens = state.tokens.filter(token => token.text.length > 0);
        renderCanvas();
      } else {
        updateAppearance(now);
      }
      requestAnimationFrame(updateTokenLifespans);
    }

    hiddenArea.addEventListener('input', handleInput);
    hiddenArea.addEventListener('compositionstart', () => { composing = true; });
    hiddenArea.addEventListener('compositionend', () => {
      handleInput();
      composing = false;
    });
    window.addEventListener('load', () => {
      hiddenArea.focus();
      renderCanvas();
      requestAnimationFrame(updateTokenLifespans);
    });
  </script>
</body>
</html>
